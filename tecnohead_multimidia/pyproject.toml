[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tecnohead-multimidia"
version = "1.4.13"
description = "Home Assistant App for area-scoped multimedia scenes"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiomqtt>=2.3,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=12,<16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 240
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
