name: "TecnoHead Multimídia"
slug: "tecnohead_multimidia"
description: "Motor de cenas multimídia multiambiente para Home Assistant"
version: "1.4.3"
stage: experimental
url: "https://github.com/aoliveira07/tecnohead-multimidia"
startup: application
boot: auto
timeout: 30

arch:
  - amd64
  - aarch64

image: ghcr.io/aoliveira07/tecnohead-multimidia
init: false
apparmor: true

# AirPlay 2 uses LAN mDNS/RAOP and a single NQPTP clock shared by both
# receiver processes. The App does not modify the host Avahi daemon; it uses
# the host D-Bus and host IPC only for the documented upstream integration.
host_network: true
host_ipc: true
host_dbus: true
realtime: true

ingress: true
ingress_port: 18199
panel_icon: mdi:projector-screen
panel_title: TecnoHead Multimídia
panel_admin: true

homeassistant: "2026.10.0"
homeassistant_api: true
hassio_api: true
hassio_role: default

services:
  - mqtt:want

map:
  - type: data

backup: hot
