name: "TecnoHead AirPlay Lab"
slug: "tecnohead_airplay_lab"
description: "Receptor AirPlay 2 descartavel para ensaios do cartao Apple Casa"
version: "0.1.10"
stage: experimental
url: "https://github.com/aoliveira07/tecnohead-multimidia"
startup: application
boot: manual
init: false
stdin: true
apparmor: true
arch:
  - amd64
  - aarch64
# Shairport uses LAN mDNS and NQPTP's shared-memory clock. No HA Core,
# Supervisor API, MQTT, ingress, LinkPlay, or audio hardware is accessed.
host_network: true
host_ipc: true
realtime: true
map:
  - type: data
options:
  profile: "B0"
  advertisement: "stock"
  network_mode: "ipv4_only"
  txt_variant: "stock"
  info_variant: "stock"
schema:
  profile: "list(B0|M1|M2|M3)"
  advertisement: "list(stock|tecnohead_model|classic_bits|tecnohead_model_classic_bits)"
  network_mode: "list(ipv4_only|dual_stack)"
  txt_variant: "list(stock|own_manufacturer|own_manufacturer_serial|required_sender_zero|without_fex)"
  info_variant: "list(stock|omit_audio_only_ui|omit_playback_capabilities)"
backup: hot
