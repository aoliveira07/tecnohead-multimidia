name: Release App image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Verify prerelease cannot replace latest
        if: contains(github.ref_name, '-')
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python - <<'PY'
          import os
          tags = os.environ['IMAGE_TAGS'].splitlines()
          assert tags and all(not tag.endswith(':latest') for tag in tags), tags
          print('Prerelease image tags:', *tags)
          PY
      - uses: docker/build-push-action@v6
        with:
          context: ./tecnohead_multimidia
          file: ./tecnohead_multimidia/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
